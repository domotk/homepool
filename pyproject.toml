# Only tooling configuration lives here: the integration itself is installed by
# copying custom_components/homepool, and has no Python dependencies of its own.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
